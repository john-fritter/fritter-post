# The Fritter Post — Sources
#
# First working draft. Cast wide. Tune after a week of real pipeline runs.
#
# Schema:
#   name  — display name
#   url   — RSS/Atom feed URL (or fetch endpoint; collector handles both)
#   type  — wire | journalism | advocacy | newsletter
#           Functional distinction, not editorial judgment. The source policy
#           reads each type differently in operational ways (wires high volume,
#           advocacy has a policy position, newsletters often single-author).
#   track — news | analysis  (default: news when omitted)
#           Which pipeline lane the source feeds. 'news' items flow into the
#           clusterer. 'analysis' items are routed aside and pool unconsumed
#           until a Longer Reads selector exists — they never enter the
#           clusterer context.
#           track is a SEPARATE axis from type: type is operational (wire/
#           journalism/advocacy/newsletter); track is which lane the item feeds.
#           A source's track is a stable property of what it publishes, not a
#           story-by-story judgment — that's why it's set on the source, not
#           derived per item.
#   group — wire | national | accountability | local | intl_broad |
#           intl_asia | intl_americas | tech | ai | climate | labor | legal | science
#           A THIRD axis, separate from both type and track. Historically it
#           told the LLM clusterer which thematic spine an item entered; the
#           current embedding-based grouping stage does not consume it, but it
#           is retained as a stable structural label on the source. It is NOT an
#           editorial or topic tag — it never reaches the paper, the editor, or
#           the reader. Tags, categories, and prominence live at the story level
#           (assigned by the editor), independent of where a source's items were
#           staged. group is a stable property of the source, not a judgment
#           about any one story.
#   notes — free text. Anything the editor/researcher should know about the
#           source, including institutional alignment where it's worth knowing.
#
# Tags, categories, prominence weighting, and tiers live at the story level,
# assigned by the editor stage.
#
# Entries marked [VERIFY] have RSS URLs that may need checking — endpoints move.

# ─────────────────────────────────────────────
# WIRES
# Backbone of the collector. High volume, high signal.
# Cross-source clustering should weight wire pickup heavily.
# ─────────────────────────────────────────────

- name: AP News
  url: https://apnews.com/news-sitemap-content.xml
  format: news-sitemap
  max_age_hours: 24
  type: wire
  group: wire
  parent: "AP"
  # AP's robots.txt permits /article/ and /live/ under its generic block and sets
  # no Crawl-delay, with exactly one specific article disallowed. That one is
  # here so the rule is followed rather than noted. Re-check on any re-probe.
  exclude_paths:
    - /article/border-immigration-election-2182fec11fa008ec96c4202e5656d19e
  notes: >
    Replaces AP Top News and AP Politics, which were both Google News RSS
    proxies and between them the single largest contributor of material to the
    paper — 250 items reached editor runs in the 14 days to 2026-08-25 — at 0%
    usable. Every link was an interstitial: 52 real links put through token
    decoding, redirect following and interstitial parsing resolved **zero**, and
    the interstitial is a 580KB JavaScript shell with no apnews.com URL in it.
    The old note here said AP served no working feed. It was wrong, and the way
    it was wrong is worth keeping: it rested on five URLs tried once, all of them
    RSS paths, and AP disallows /*.rss — so that probe could only ever have
    failed. Reading robots.txt instead finds six declared sitemaps. Verified
    2026-08-26: news-sitemap-content.xml returns 200 text/xml with 529 entries,
    518 of them /article/, 6 /photo-gallery/, 3 /live/, 2 /newsletter/, spanning
    ~28 hours with 281 inside 24. Fifteen sampled pages run through the real path
    (extractArticle + stripBoilerplate) all cleared 800 characters.
    Note the declared name: the guessable /news-sitemap.xml is a near-empty
    2-entry file, so a path battery would have concluded failure a second time.
    What it costs: a sitemap carries no body, so these items reach the prefilter,
    grouping and scoring on their titles alone, and only those that reach the
    editor get their text fetched. Not a regression — the proxy items carried a
    ~100-character headline echo that isHeadlineEcho stripped anyway — but it is
    the thing to watch in the first run.
    The three /live/ entries are live blogs and extracted 20,000-39,000
    characters; the junk filter and isLiveBlog are what stand between those and a
    writer packet.

