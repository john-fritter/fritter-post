# Model assignments per pipeline stage.
# All models must be accessible via LLM_BASE_URL (OpenAI-compatible).

# Preprocessor tuning. The preprocessor is deterministic (no LLM), but its
# recency window and dedup lookback are configuration, not magic numbers.
preprocessor:
  recency:
    # Fixed window on fetched_at: every run selects the last window_hours of
    # raw_items regardless of prior run cadence. Cross-run dedup (lookback_days
    # below) suppresses stories already processed, so same-day re-runs return
    # near-empty by design without shrinking the input window.
    window_hours: 24
    # Backstop against a feed dumping its archive as "new": items whose
    # published_at is older than this are dropped even if freshly fetched.
    # Kept generous so a legitimately lagging feed's late-surfaced story still
    # passes. Set to null to disable the backstop entirely.
    max_age_days: 14
  dedup:
    # How far back across prior runs to suppress an already-processed story that
    # has been re-ingested under a new URL/guid (same canonical URL or
    # normalized title).
    lookback_days: 5
  # Per-item translation of non-English title + body[:2000] to English so that
  # all clustering happens in one embedding space. English items are copied
  # through; translation failures fall back to the original text. Thinking/
  # reasoning off: this is a mechanical translation task, not editorial judgment.
  translation:
    model: Qwen/Qwen3.6-35B-A3B
    provider: nanogpt
    temperature: 0.1
    max_tokens: 4096
    reasoning_effort: "none"
    stream: false
    # Raised from 60s after run #43: calls averaged ~40s against a 60s ceiling,
    # so 17 timed out and 171 of 462 non-English items (37%) fell back to
    # original-language text for embedding — silently defeating the
    # English-space clustering this stage exists for. callWithBackoff retries
    # 429/503 only, so a timeout is a permanent failure, not a retry.
    timeout_ms: 180000
    # One LLM call per batch covers both title and body for all N items. Reduces
    # total calls from 2×items to ceil(non_english/batch_size). Alignment safety
    # via id-keyed JSONL output and recursive split-on-failure retry.
    translation_batch_size: 10
    # Raised back to 8. The 10→4 drop was made alongside the timeout increase on
    # the theory that contention was causing the timeouts, but run #44 settled
    # that: translation logged 2 timeouts and *zero* rate-limit errors, so the
    # provider was never the constraint. At concurrency 4, 61 batches take ~16
    # sequential rounds — most of the stage's 13.5 minutes. Slow calls are now
    # handled by splitting rather than by starving the pipeline, and any 429s
    # that do appear go through callWithBackoff.
    concurrency: 8
    # 429/503 backoff for translation calls. 5 attempts, 2s base, max 64s cap.
    retry_max_attempts: 5
    retry_base_ms: 2000

# Bio-aware relevance floor between the preprocessor and the clusterer — a
# separate, later judgment from `filter` (garbage vs. reader-relevance; see
# docs/decisions.md). Same model family as editor_pass_1's bio-aware scoring,
# since this stage is built to become a scorer itself with only a prompt swap.
prefilter:
  model: zai-org/glm-5.2
  provider: nanogpt
  temperature: 0.1
  max_tokens: 4096
  batch_size: 40
  # Characters of English body text shown per item.
  #
  # Was a hardcoded slice(0, 50) — about eight words — so run #47's relevance
  # floor sorted 1,206 items into cut/news/opinion on the headline plus the
  # first half of the lede. That is enough to recognise a horoscope and not
  # enough to tell a substantive foreign story from a wire brief, which is
  # exactly the call this stage's conservative-keep rule asks it to make.
  #
  # 500 characters is roughly the first paragraph: enough to see what happened
  # and who it happened to. Cost is linear and modest — run #47 spent 99k input
  # tokens over 31 calls; 500 chars × 40 items adds ~5k tokens per call, so
  # expect roughly 250k. Raise it if cuts still look careless, but check the
  # cut log before assuming the model is the problem.
  body_cap: 500
  # Lowered from 10 after run #37 logged 7 rate-limit errors across 41 calls —
  # the same saturation grouping hit at 10. Prefilter recovers via
  # callWithBackoff, so this is throughput tuning, not correctness.
  concurrency: 4
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000
  retry_max_attempts: 5
  retry_base_ms: 2000

# Thread pass: groups related clusters and singletons into ongoing situations,
# above grouping's event-level clustering. Runs after grouping-pass-1 scoring and
# before pile assembly.
#
# Grouping asks "is this the same event?"; threading asks "is this the same
# continuing story?". Run #43 produced five separate Oregon wildfire clusters,
# four in the top fifteen, because the fires are one situation made of many
# events. Threading fixes that without loosening the event question — which is
# what lets the split pass keep event clustering strict.
#
# A thread is a first-class row the editor ranks: relevance = max(member score),
# sources = sum(member source counts), so the editor formula applies unchanged.
thread:
  enabled: true
  # Top-scored rows offered to the pass. A thread's members are spread across
  # the score range (run #43's fires scored 78, 85, 80, 80, 60), so this must be
  # generous enough to hold a whole situation — well past pile_target. It is
  # bounded by what a single call can hold, since chunking by score would hide
  # members of the same situation from each other.
  candidate_target: 220
  # Characters of cluster summary / English singleton body per candidate. Was a
  # hardcoded 300 and stays there: one call carries all 220 candidates, so this
  # multiplies by candidate_target and the pass is already the run's longest
  # single call. Threading is a pattern-match over titles — it needs enough to
  # place a headline in a situation, not the whole article.
  summary_cap: 300
  model: zai-org/glm-5.2:thinking
  provider: nanogpt
  temperature: 0.1
  # Run #40's thread call consumed exactly 24000 output tokens over 11 minutes
  # and returned nothing: reasoning ate the whole budget before any content was
  # emitted, and the pass produced zero threads. Run #44 had done the same job on
  # the same 220 candidates in 4,651 output tokens and 63 seconds, so this is
  # variance in how far the model spirals, not a task that needs 24k.
  #
  # Both levers are moved because they address different halves. Headroom means
  # a long reasoning pass still leaves room to answer; lower effort makes the
  # long pass less likely in the first place. Finding a handful of ongoing
  # situations among 220 headlines is pattern-matching, not deep inference —
  # grouping's attach and describe passes run at "none".
  #
  # If thread quality drops, revert reasoning_effort to "medium" first and keep
  # the larger budget; that isolates which lever mattered.
  max_tokens: 48000
  reasoning_effort: "low"
  stream: true
  # Note: with stream: true this is effectively a headers timeout, not a total
  # one. Run #40's call ran 658s against a 600s setting because the stream stays
  # alive once headers arrive. The token budget is the real bound here.
  timeout_ms: 600000
  retry_max_attempts: 5
  retry_base_ms: 2000

editor:
  # Deterministic formula: combined = relevance + source_weight * ln(sources)
  # ln(1)=0 so singletons get no lift; a 53-source cluster gets ~+35 at W=9.
  source_weight: 9
  # Tier counts for a 150-item pile (15+60+75=150). Features fill first, then
  # standard, then brief — the last tier absorbs the shortfall on smaller piles.
  tiers:
    feature: 15
    standard: 60
    brief: 75
  # Bio-aware tie-break: one small LLM call per group of items that share an
  # identical combined score, ranking them against each other by reader relevance.
  # Cheap fast model; groups are small; calls run concurrently.
  tie_break:
    model: zai-org/glm-5.2:thinking
    provider: nanogpt
    temperature: 0.1
    max_tokens: 24000
    concurrency: 10
    reasoning_effort: "xhigh"
    stream: true
    timeout_ms: 300000
    # Characters of summary / English body per item in a tie-break group. Was a
    # hardcoded 300 and stays there. Groups are small, so this is cheap — but it
    # only matters while ties are dense; if editor_pass_1.body_cap does its job
    # the tie-break should end up ranking a handful of items, not most of the
    # paper.
    body_cap: 300

# Writers stage. The writer call itself is not built yet — the model id below is
# still a placeholder — but the fetch sub-stage that feeds it is.
writers:
  # GLM for prose, as concept.md called for, and the same family the judgment
  # stages run on. Non-thinking: writing 400 words from twelve sources in front
  # of you is composition, not inference, and run #40's lesson was that a
  # thinking model can spend its whole budget reasoning and emit nothing.
  model: zai-org/glm-5.2
  provider: nanogpt
  # Higher than every other stage. The judgment stages want repeatability; this
  # one wants prose that does not read like a form letter.
  temperature: 0.6
  # A feature is 400-600 words, roughly 900 tokens. The headroom is for a batch
  # of ten briefs plus whatever reasoning_effort "low" spends.
  max_tokens: 8000
  reasoning_effort: "low"
  stream: true
  timeout_ms: 300000
  # 15 features + 60 standards = 75 individual calls, plus 8 brief batches.
  concurrency: 4
  brief_batch_size: 10
  retry_max_attempts: 5
  retry_base_ms: 2000
  # Stop the run after this many consecutive call failures.
  #
  # Run #4 met a provider outage: streams broke call after call, and since
  # callWithBackoff retries broken streams, 103 logical calls became 807 provider
  # attempts with 775 errors. The run spent 31 minutes to write 17 pieces and the
  # repair pass another 34 to add 22. Nothing about the hundredth request was
  # going to succeed where the first ninety-nine failed.
  #
  # Consecutive rather than a failure rate: one hard piece among successes is a
  # piece problem, a hundred in a row is an outage, and only the second is worth
  # abandoning a run over. 10 is roughly two rounds at concurrency 4 — long
  # enough that a couple of unlucky calls do not trip it. Set to 0 to disable.
  abort_after_consecutive_failures: 10

  # Article text fetch. Editor run #112's audit is the source of every number
  # here: 305 underlying articles, 185 of them (61%) under 800 characters of feed
  # body and 132 under 300, with thinness concentrated by outlet rather than
  # spread evenly — AP, Al Jazeera, BBC World, NYT and the Oregonian ran 100%
  # teasers; Meduza, KTVZ, the Bend Bulletin and OPB ran none.
  fetch:
    enabled: true
    # Briefs are one-liners; a headline and a lede is already enough for one.
    # This is what keeps the fetch at ~139 requests rather than ~230.
    tiers: [feature, standard]
    # Only fetch what the feed left short. Matches THIN_CHARS in the materials
    # audit, so the audit's "thin" count and the fetch worklist are the same set:
    # roughly a headline plus a lede, which is what the judgment stages read and
    # what a writer cannot work from.
    feed_chars_floor: 800
    # Below this, extraction did not find an article — a paywall, a consent wall,
    # or a JavaScript shell. The row is marked thin and the assembler falls back
    # to the feed text. Set above feed_chars_floor on purpose: a fetch that
    # barely matches the teaser was not worth making.
    min_extracted_chars: 1200
    # Hosts fetched in parallel. Each host's own URLs are always sequential with
    # per_host_delay_ms between them, so this is a fan-out across publishers, not
    # pressure on any one of them. Run #112's busiest fetchable host held 15
    # articles, which at 1.5s apart is well under a minute.
    concurrency: 6
    per_host_delay_ms: 1500
    timeout_ms: 20000
    # Do not re-request an article attempted inside this window, whatever the
    # outcome. Run #112's full fetch re-requested the 20 URLs its own capped run
    # had just retrieved: the plan consulted the cooldown but never the cache.
    # 20 hours means a same-day re-run costs nothing and tomorrow's paper starts
    # clean.
    refetch_after_hours: 20
    # A news page above this is nav, ads and tracking, not article text.
    max_bytes: 5000000
    # This is the only table holding third-party full text. It exists to write
    # the paper, is never published, and is swept on this window.
    retention_days: 14
    # Leave alone the hosts that keep refusing. NYT and OregonLive answer with a
    # DataDome device check that the browser identity does not get past, so
    # re-requesting them daily is 18 pointless requests. Learned from
    # article_texts rather than configured as a blocklist: a host with no success
    # in the window and at least min_attempts failures is skipped, and recovers
    # by itself once those failures age out.
    cooldown:
      enabled: true
      window_days: 7
      min_attempts: 3

  # Prompt assembly: how much material each tier's writer sees, and how it is cut
  # down to that. Every number here is a budget, not a judgment — the judgment
  # happened in the prefilter and grouping-pass-1, and the editor's tier is what
  # carries it into this stage.
  packet:
    # A paragraph shorter than this is exempt from duplicate removal. A dateline,
    # a one-line attribution, or "Reuters contributed to this report" repeating
    # across outlets is not the redundancy we are removing, and cutting it would
    # reshape a lede.
    min_dedup_paragraph_chars: 120
    # Sections: a thread is several pieces under one heading, not one piece.
    #
    # Threading absorbs a situation's rows into one ranked story. That is right
    # for ranking and wrong for writing: run #3 put T1's twelve members into one
    # 500-word slot and the writer kept one of them, dropping a story scoring 81
    # while the paper ran a 35-word brief on one scoring 56.
    #
    # The top member leads at the story's own tier, the next max_sidebars get
    # their own piece one tier down, and every remaining member gets a line — so
    # nothing a thread absorbed disappears. Material is partitioned by member, so
    # two pieces of a section cannot overlap.
    section:
      # Sidebars per section. Three plus a lead is a section a reader can finish;
      # more turns the top of the paper into one subject. The tail still gets
      # lines, so this caps depth rather than coverage.
      max_sidebars: 3
    # Ceiling for a piece whose material is headline-only, whatever its tier.
    #
    # Run #8's T1 sidebar S53521 had a headline and a lede and produced detail
    # about the 1924 Johnson-Reed Act that no source carried. Asking for 120-200
    # words from 150 characters is asking the model to fill the gap, and the note
    # telling it not to is competing with the length target. Removing the
    # pressure is more reliable than instructing against it.
    headline_only_words: [25, 60]
    # Tiers whose slot a headline-only story may not hold, most prominent first.
    #
    # The editor tiers by rank position alone, and its formula —
    # relevance + source_weight*ln(sources) — cannot see whether any text exists
    # behind a story. Run #42 published 37 of 150 pieces on headline-only
    # material, three of them features: rank 7 ran one sentence and then a note
    # to the operator, rank 18 was 24 words ending "the New York Times reports".
    # Both were on hosts the fetch cooldown had already given up on, which the
    # pipeline knew before it made the call.
    #
    # A story that cannot fill its slot trades tiers with the nearest-ranked one
    # below it that can, so the paper keeps 15 features on a day the local
    # outlets block us rather than shrinking to 12 — and the well-sourced
    # standards sitting just under the line get the treatment they can carry.
    # Ranks and scores are never touched.
    #
    # `brief` is deliberately absent: a brief is a pointer and a headline is
    # enough for one. An empty list disables the rule.
    tiers_requiring_material: [feature, standard]
    # Floor for a body to be worth a packet slot at all, after furniture removal.
    # Deliberately low: run #112's Al Jazeera summary was 89 characters and
    # carried a real fact, while the Google News stub next to it was the headline
    # repeated. Length catches the empties; the headline-echo rule in
    # boilerplate.ts catches the stubs. Never empties a packet — if every source
    # is a stub, the best one stays.
    min_article_chars: 60
    tiers:
      # **Source material is not rationed.** max_articles and total_chars are
      # null everywhere: if an item survived collection, prefiltering, grouping
      # and the editor, and it is not a verbatim duplicate, the writer sees it.
      #
      # They used to be 12 articles / 48,000 chars for a feature and 6 / 12,000
      # for a standard, justified as redundancy control. That was wrong twice
      # over. Redundancy is already handled — selection reads one article per
      # outlet before a second from the same one, and dedupeParagraphs removes
      # what another source said verbatim — so the caps were a third mechanism
      # for a solved problem, and unlike those two they discarded whole sources
      # rather than repeated text. Run #114's Iran thread lost 5 of its 17
      # articles that way, and run #17's rank 32 printed a false statement
      # because per_article_chars cut the article before the part that answered
      # the question.
      #
      # Deciding what bears on a piece is the writer's judgment. It reads the
      # sources and decides what the story is; that is the job, and it is the
      # reason the pipeline gathers and groups sources in the first place. When
      # a piece comes out too long the fix is guidance on how to editorialize,
      # never less to read.
      #
      # per_article_chars and floor_chars are inert while total_chars is null.
      # They exist so that if a cap ever has to be set — a page that would blow
      # a context window — the squeeze spreads across outlets instead of letting
      # two long sources take everything.
      feature:
        max_articles: null
        total_chars: null
        per_article_chars: 6000
        floor_chars: 800
        target_words: [400, 600]
        thin_material_chars: 3000
        full_material_chars: 12000
      standard:
        max_articles: null
        total_chars: null
        per_article_chars: 3000
        floor_chars: 500
        target_words: [120, 200]
        thin_material_chars: 900
        full_material_chars: 3000
      # The short forms are short because the *piece* is short, not because the
      # writer is given less to read. Their thin/full thresholds still describe
      # how much material a piece of that size needs before it counts as
      # well-sourced.
      brief:
        max_articles: null
        total_chars: null
        per_article_chars: 1200
        floor_chars: 400
        target_words: [25, 45]
        thin_material_chars: 300
        full_material_chars: 900
      sidebar:
        max_articles: null
        total_chars: null
        per_article_chars: 2000
        floor_chars: 600
        target_words: [45, 70]
        thin_material_chars: 400
        full_material_chars: 1200
      line:
        max_articles: null
        total_chars: null
        per_article_chars: 900
        floor_chars: 300
        target_words: [15, 30]
        thin_material_chars: 200
        full_material_chars: 600

editor_pass_1:
  model: zai-org/glm-5.2:thinking
  provider: nanogpt
  temperature: 0.1
  max_tokens: 24000
  batch_size: 40
  # The highest concurrency in the pipeline, and until 2026-08-26 the only
  # batched concurrent stage with no retry at all — callWithBackoff was not even
  # imported. One 429 on the first and only attempt defaulted a whole batch of 40
  # to a fabricated score. Run #42 lost clusters C80-C83 that way.
  concurrency: 10
  retry_max_attempts: 5
  retry_base_ms: 2000
  reasoning_effort: "medium"
  singleton_pile_target: 100
  # Characters of English body text shown per SINGLETON being scored.
  #
  # This is the fix for run #47's tie storm. Singletons were scored on title +
  # slice(0, 50) while clusters were scored on a full describe-pass summary, so
  # the scorer had real material for one row type and a headline for the other.
  # With nothing to discriminate on it fell back to coarse title-shaped buckets:
  # 150 published rows carried only 38 distinct combined scores, 127 of them sat
  # in a tie, and both tier boundaries landed inside a tie group — so whether a
  # story ran as a feature was settled by the tie-break LLM, or when that call
  # dropped refs, by alphabetical ref order.
  #
  # 1000 is deliberately more than prefilter's 500: this is a 0–100 judgment
  # rather than a keep/cut floor, and it runs over ~420 singletons rather than
  # ~1,200 items, so the finer judgment is also the cheaper one to feed.
  #
  # Watch the score histogram after changing this. If ties stay this dense with
  # a full opening paragraph in hand, the problem is the prompt's scoring bands,
  # not the input, and the next lever is the band definitions in prompt.ts.
  body_cap: 1000
  # Characters of describe-pass summary shown per CLUSTER being scored. Was a
  # hardcoded 300 and stays at 300 — cluster summaries are already distilled and
  # rarely run longer than this.
  summary_cap: 300
  stream: true
  timeout_ms: 600000

# Embedding model for the grouping stage.
# Qwen3-Embedding-8B via OpenRouter at 4096 dims; matches vector(4096) in
# item_embeddings (migration 020). batch_size controls texts per API call.
# body_cap is set in grouping.embedding.body_cap (2000 chars) — not here.
embeddings:
  model: qwen/qwen3-embedding-8b
  provider: openrouter
  dims: 4096
  batch_size: 100
  timeout_ms: 120000

# Embedding-based grouping stage — the pipeline's clustering step.
# Four steps: embed (software + embedding model), candidate groups (software,
# cosine-similarity graph + union-find), attach (LLM, near-miss singletons),
# describe (LLM, neutral title + summary per multi-item cluster).
#
# THE KNOB: embedding.similarity_threshold is the primary tuning lever.
# Higher = fewer, tighter groups. Lower = more, looser groups.
grouping:
  # Stage-level model. The attach and describe sub-steps set their own models
  # under grouping.attach / grouping.describe; this top-level value satisfies
  # the shared stage-config schema.
  model: alibaba/qwen3.6-27b:thinking
  provider: nanogpt
  temperature: 0.1
  max_tokens: 8192
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000
  embedding:
    # Max characters from body_text included in embed text per item.
    # 2000 chars captures enough of the article opening that same-event
    # pairs score meaningfully higher than same-topic-different-event pairs.
    body_cap: 2000
    # Cosine similarity threshold for adding an edge between two items.
    # Start here and sweep: higher tightens groups, lower loosens them.
    similarity_threshold: 0.66
    # Top-K nearest neighbors per item considered for edge creation.
    # Limits graph density; raise if same-story items are getting missed.
    top_k: 15
  # Split pass (step 2b): repairs over-merges created by union-find.
  #
  # Connected components only require a PATH between members, so a bridging
  # article chains unrelated stories into one cluster (run #35's "Power grid
  # strains and data center moratoriums" joined a Virginia power line to a New
  # York moratorium). Until this pass, step-2 components became clusters with no
  # LLM ever seeing them — the attach prompt's "shares only a topic is not the
  # same event" rule never applied to them.
  #
  # The measure is COHESION: edges present / possible pairs, divided by the most
  # that embedding.top_k allows at that component size. The raw ratio alone would
  # be wrong — top_k caps each item at 15 neighbours, so a 37-item component can
  # never exceed 15/36 = 0.42 however coherent it is, and run #35's 37-source
  # US-Iran cluster would be flagged every run. Dividing by the ceiling makes
  # 1.0 mean "as connected as it could be" at any size; a chain stays near zero.
  #
  # Only components both large enough to chain and loosely connected get a call,
  # so the dense majority costs nothing.
  split:
    enabled: true
    # Below this cohesion a component is treated as possibly chained.
    #
    # Raised from 0.5 after run #40. A pure chain — the exact over-merge shape —
    # scores 2/n at raw density, which for n=4 is exactly 0.500. The check is
    # `cohesion < density_floor`, so at 0.5 the canonical 4-item chain passed on
    # a boundary equality, and run #40 had four components sitting precisely
    # there (three of them size 4). 0.55 catches them; the next component up in
    # that run scored 0.57, so nothing legitimate is swept in. Costs ~4 extra
    # LLM calls per run, and the model is still the precision gate — a component
    # that is genuinely one story comes back as one group.
    #
    # Chains of size 3 score 0.667 and remain out of reach: catching them would
    # need a floor above 0.67, which is where many legitimate components sit.
    density_floor: 0.55
    # Components of size 2 are density 1.0 by construction and cannot chain.
    # Size 3 is the smallest that can.
    min_size: 3
    model: zai-org/glm-5.2
    provider: nanogpt
    temperature: 0.1
    max_tokens: 24000
    concurrency: 4
    reasoning_effort: "none"
    stream: true
    timeout_ms: 300000
    retry_max_attempts: 5
    retry_base_ms: 2000
  # Attach pass: concurrent rounds. Each round snapshots current state, builds
  # candidates for all eligible anchors, runs all LLM calls concurrently under
  # pLimit(concurrency), then applies merges deterministically (highest anchorBestSim
  # wins a contested singleton). Cascade attach: clusters formed in round N are
  # visible in round N+1. Rounds repeat until a round yields zero new merges.
  # Attach-only; never splits. candidate_floor is the sole candidate filter.
  attach:
    enabled: true
    # Cosine-similarity floor (title-only) for offering a candidate to the LLM.
    # 0.55 catches same-event pairs (measured at 0.78+) and cross-event near-misses
    # (e.g. Samsung pair at 0.635) while skipping true orphans. The LLM is the
    # precision gate — there is no auto-accept tier and no per-anchor cap.
    candidate_floor: 0.55
    model: zai-org/glm-5.2
    provider: nanogpt
    temperature: 0.1
    max_tokens: 24000
    # Governs actual in-flight LLM calls. Lowered from 10 after run #34 (2026-06-19)
    # logged 81 rate-limit errors across 163 grouping calls: Phase A and Phase B
    # both run under this limit, and at 10 the pass saturated the provider. A
    # failed attach call silently means "attach nothing", so 429s cost cluster
    # quality invisibly — prefer fewer in-flight calls over retry churn.
    concurrency: 4
    reasoning_effort: "none"
    stream: true
    timeout_ms: 300000
    # 429/503 backoff. Without this a rate-limited attach call is indistinguishable
    # from the model declining every candidate.
    retry_max_attempts: 5
    retry_base_ms: 2000
  # Describe pass: cheap batched LLM call that writes a neutral title and
  # short summary for every multi-item cluster. Runs after attach. Singletons
  # skip this pass.
  describe:
    model: zai-org/glm-5.2
    provider: nanogpt
    temperature: 0.1
    max_tokens: 4096
    # Clusters per LLM call. Each call sees batch_size clusters, each shown
    # as its member items (title + body excerpt).
    batch_size: 20
    # Lowered alongside attach.concurrency for the same rate-limit reason. A
    # failed describe batch leaves every cluster in it with a fallback label.
    concurrency: 4
    reasoning_effort: "none"
    stream: true
    timeout_ms: 120000
    retry_max_attempts: 5
    retry_base_ms: 2000
  # Top-N rows (clusters + singletons combined) by bio-relevance score that
  # pass into the editor pile. Replaces the old all-clusters + singleton_pile_target logic.
  pile_target: 150
