# Model assignments per pipeline stage.
# All models must be accessible via LLM_BASE_URL (OpenAI-compatible).

filter:
  model: deepseek/deepseek-v4-flash  # NanoGPT model id (confirmed nano-gpt.com/models)
  provider: nanogpt
  temperature: 0.1
  max_tokens: 4096
  batch_size: 100
  concurrency: 10
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000

# Bio-aware relevance floor between the preprocessor and the clusterer — a
# separate, later judgment from `filter` (garbage vs. reader-relevance; see
# docs/decisions.md). Same model family as editor_pass_1's bio-aware scoring,
# since this stage is built to become a scorer itself with only a prompt swap.
prefilter:
  model: zai-org/glm-5.1
  provider: nanogpt
  temperature: 0.1
  max_tokens: 4096
  batch_size: 40
  concurrency: 10
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000

triage:
  model: alibaba/qwen3.6-27b:thinking
  provider: nanogpt
  temperature: 0.1
  max_tokens: 65536
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000
  clustering:
    # Wire-seed + parallel-spines + deterministic-merge clusterer (replaces
    # the single-chain ordered-rounds design — see docs/decisions.md 2026-06-07
    # "single-chain rounds → wire seed + parallel spines + id-union merge").
    #
    # A single accretion chain failed twice: it's sequential (one LLM call
    # waits on the last) AND every round inherits all prior unclustered items,
    # so the carry-forward "loose pool" re-inflates round over round (495 →
    # 714 items by round 10) until a round's prompt blows past the model's
    # working range and times out.
    #
    # The fix removes both problems at once:
    #   1. SEED — cluster only `seed` groups (the wire) in one call. Produces
    #      the day's major-story clusters.
    #   2. SPINES — `spines` partition the rest of the news pile into
    #      thematic sets of groups. Each spine gets ONE call: the seed's
    #      cluster list verbatim + that spine's items as "new items," with
    #      the existing incremental instruction (attach/merge/create/re-emit
    #      complete list). No carry-forward — every spine starts fresh from
    #      the same seed and sees only its own items, so every prompt stays
    #      in the model's working range regardless of total pile size. Spines
    #      run concurrently, capped at `max_concurrent_spines`.
    #   3. MERGE — deterministic software, not an LLM call. Every spine
    #      re-emits the complete list it started from (the seed clusters)
    #      plus whatever it added, so the same major story appears in every
    #      spine's output sharing the SAME seed item ids — an exact,
    #      free merge key. Union any two clusters across spine outputs that
    #      share >= 1 id, transitively, and dedupe ids keep-first. No
    #      semantic matching needed for the cases this catches.
    #
    # group is set on preprocessed_items at preprocess time from each
    # source's `group` in config/sources.yaml — a structural clustering axis,
    # not an editorial tag (see that file's schema comment). Any news group
    # that appears in neither `seed` nor any `spines` entry is swept into an
    # implicit fallback spine at runtime, so nothing is silently excluded.
    seed: [wire]
    spines:
      - name: domestic
        groups: [national, accountability, legal, labor]
      - name: intl_broad
        groups: [intl_broad]
      - name: intl_asia
        groups: [intl_asia]
      - name: intl_americas
        groups: [intl_americas]
      - name: local
        groups: [local, climate, science]
      - name: tech
        groups: [tech, ai]
    max_concurrent_spines: 10
    # Final clustering step: one LLM call over a SMALL input (the merged
    # cluster list + a bounded slice of high-relevance singletons) that
    # merges same-story clusters the deterministic id-union merge missed
    # (no shared item ids — e.g. covered by disjoint source sets) and
    # attaches orphaned singletons that clearly belong, including
    # cross-language items. See docs/decisions.md.
    semantic_merge:
      enabled: true
      model: alibaba/qwen3.6-27b:thinking
      max_tokens: 16000
      reasoning_effort: "none"
      max_singletons: 60
      # Fallback guard: if any single cluster in the pass's output holds more
      # than this share of all clustered ids, the output is rejected as a
      # runaway "umbrella"/"conflict blob" merge and the pre-pass (id-union
      # merge) result is used instead. See docs/decisions.md.
      max_cluster_share: 0.30

# Unbuilt placeholder — stage not yet implemented; model id is not real.
researcher:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.4
  max_tokens: 4000
  step_limit: 20

editor:
  model: moonshotai/kimi-k2.6:thinking
  provider: nanogpt
  temperature: 0.2
  max_tokens: 48000
  reasoning_effort: "medium"
  stream: true
  timeout_ms: 600000
  # stream: true — keeps the HTTP connection alive past undici's ~300s headers
  # timeout when a reasoning model thinks before emitting the first token.
  # timeout_ms: 600000 — generous body/stream timeout for long reasoning calls.
  # provider: nanogpt — uses NANOGPT_BASE_URL / NANOGPT_API_KEY.
  fallback:
    model: zai-org/glm-5.1:thinking
    provider: nanogpt
    reasoning_effort: "medium"

# Unbuilt placeholder — stage not yet implemented; model id is not real.
writers:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.6
  max_tokens: 2000

editor_pass_1:
  model: zai-org/glm-5.1:thinking
  provider: nanogpt
  temperature: 0.1
  max_tokens: 4096
  batch_size: 40
  concurrency: 10
  reasoning_effort: "none"
  singleton_pile_target: 100
  stream: true
  timeout_ms: 600000

# Embedding model for the grouping stage.
# Qwen3-Embedding-8B via OpenRouter at 4096 dims; matches vector(4096) in
# item_embeddings (migration 020). batch_size controls texts per API call.
# body_cap is set in grouping.embedding.body_cap (2000 chars) — not here.
embeddings:
  model: qwen/qwen3-embedding-8b
  provider: openrouter
  dims: 4096
  batch_size: 100
  timeout_ms: 120000

# Embedding-based grouping stage — runs in parallel with triage for comparison.
# Three steps: embed (software + embedding model), candidate groups (software,
# cosine-similarity graph + union-find), boundary refine (LLM, one call per
# large candidate group).
#
# THE KNOB: embedding.similarity_threshold is the primary tuning lever.
# Higher = fewer, tighter groups. Lower = more, looser groups.
grouping:
  # LLM used for step 3 boundary-refine calls (one call per candidate group
  # of size >= refine.min_group_size).
  model: alibaba/qwen3.6-27b:thinking
  provider: nanogpt
  temperature: 0.1
  max_tokens: 8192
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000
  embedding:
    # Max characters from body_text included in embed text per item.
    # 2000 chars captures enough of the article opening that same-event
    # pairs score meaningfully higher than same-topic-different-event pairs.
    body_cap: 2000
    # Cosine similarity threshold for adding an edge between two items.
    # Start here and sweep: higher tightens groups, lower loosens them.
    similarity_threshold: 0.72
    # Top-K nearest neighbors per item considered for edge creation.
    # Limits graph density; raise if same-story items are getting missed.
    top_k: 10
  refine:
    # Set to true to run the LLM boundary-refine step (one call per large
    # candidate group asking "same event or split?"). False = skip entirely;
    # connected-component groups are the final groups. Keep code, just disable.
    enabled: false
    # Candidate groups with >= this many items receive a refine call when enabled.
    min_group_size: 3
    # Max concurrent LLM boundary-refine calls.
    concurrency: 5
  # Attach pass: for each multi-item cluster, find singletons whose max cosine
  # similarity to any cluster member falls in [attach_floor, similarity_threshold)
  # — the near-miss band — and make one LLM call per cluster to confirm which
  # (if any) belong to the same specific event. Runs after connected-components,
  # before describe. Attach-only; never splits clusters.
  attach:
    enabled: true
    # Lower bound of the near-miss band. Singletons below this floor are too
    # dissimilar to be worth offering to the LLM.
    attach_floor: 0.60
    model: zai-org/glm-5.1
    provider: nanogpt
    temperature: 0.1
    max_tokens: 1024
    concurrency: 5
    reasoning_effort: "none"
    stream: true
    timeout_ms: 120000
  # Describe pass: cheap batched LLM call that writes a neutral title and
  # short summary for every multi-item cluster. Runs after attach (and refine
  # when enabled). Singletons skip this pass.
  describe:
    model: zai-org/glm-5.1
    provider: nanogpt
    temperature: 0.1
    max_tokens: 4096
    # Clusters per LLM call. Each call sees batch_size clusters, each shown
    # as its member items (title + body excerpt).
    batch_size: 20
    concurrency: 5
    reasoning_effort: "none"
    stream: true
    timeout_ms: 120000
  # Top-N rows (clusters + singletons combined) by bio-relevance score that
  # pass into the editor pile. Replaces the old all-clusters + singleton_pile_target logic.
  pile_target: 150
