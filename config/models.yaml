# Model assignments per pipeline stage.
# All models must be accessible via LLM_BASE_URL (OpenAI-compatible).

# Preprocessor tuning. The preprocessor is deterministic (no LLM), but its
# recency window and dedup lookback are configuration, not magic numbers.
preprocessor:
  recency:
    # Eligibility is keyed off the previous successful preprocessor run: an item
    # is in-window when its fetched_at ("first time we saw it") is at or after
    # that run's start. fallback_hours is the window used for the very first run
    # or an empty history, sized to absorb the initial backlog.
    fallback_hours: 48
    # Backstop against a feed dumping its archive as "new": items whose
    # published_at is older than this are dropped even if freshly fetched.
    # Kept generous so a legitimately lagging feed's late-surfaced story still
    # passes. Set to null to disable the backstop entirely.
    max_age_days: 14
  dedup:
    # How far back across prior runs to suppress an already-processed story that
    # has been re-ingested under a new URL/guid (same canonical URL or
    # normalized title).
    lookback_days: 5
  # Per-item translation of non-English title + body[:2000] to English so that
  # all clustering happens in one embedding space. English items are copied
  # through; translation failures fall back to the original text. Thinking/
  # reasoning off: this is a mechanical translation task, not editorial judgment.
  translation:
    model: Qwen/Qwen3.6-35B-A3B
    provider: nanogpt
    temperature: 0.1
    max_tokens: 4096
    reasoning_effort: "none"
    stream: false
    timeout_ms: 60000
    # One LLM call per batch covers both title and body for all N items. Reduces
    # total calls from 2×items to ceil(non_english/batch_size). Alignment safety
    # via id-keyed JSONL output and recursive split-on-failure retry.
    translation_batch_size: 10
    # 2 concurrent batch calls at a time — enough throughput, avoids 429 bursts.
    concurrency: 2
    # 429/503 backoff for translation calls. 5 attempts, 2s base, max 64s cap.
    retry_max_attempts: 5
    retry_base_ms: 2000

filter:
  model: deepseek/deepseek-v4-flash  # NanoGPT model id (confirmed nano-gpt.com/models)
  provider: nanogpt
  temperature: 0.1
  max_tokens: 4096
  batch_size: 100
  concurrency: 10
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000

# Bio-aware relevance floor between the preprocessor and the clusterer — a
# separate, later judgment from `filter` (garbage vs. reader-relevance; see
# docs/decisions.md). Same model family as editor_pass_1's bio-aware scoring,
# since this stage is built to become a scorer itself with only a prompt swap.
prefilter:
  model: zai-org/glm-5.1
  provider: nanogpt
  temperature: 0.1
  max_tokens: 4096
  batch_size: 40
  concurrency: 10
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000

# Unbuilt placeholder — stage not yet implemented; model id is not real.
researcher:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.4
  max_tokens: 4000
  step_limit: 20

editor:
  # Deterministic formula: combined = relevance + source_weight * ln(sources)
  # ln(1)=0 so singletons get no lift; a 53-source cluster gets ~+35 at W=9.
  source_weight: 9
  # Tier counts for a 150-item pile (15+60+75=150). Features fill first, then
  # standard, then brief — the last tier absorbs the shortfall on smaller piles.
  tiers:
    feature: 15
    standard: 60
    brief: 75
  # Bio-aware tie-break: one small LLM call per group of items that share an
  # identical combined score, ranking them against each other by reader relevance.
  # Cheap fast model; groups are small; calls run concurrently.
  tie_break:
    model: zai-org/glm-5.1:thinking
    provider: nanogpt
    temperature: 0.1
    max_tokens: 24000
    concurrency: 10
    reasoning_effort: "xhigh"
    stream: true
    timeout_ms: 300000

# Unbuilt placeholder — stage not yet implemented; model id is not real.
writers:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.6
  max_tokens: 2000

editor_pass_1:
  model: zai-org/glm-5.1:thinking
  provider: nanogpt
  temperature: 0.1
  max_tokens: 24000
  batch_size: 40
  concurrency: 10
  reasoning_effort: "medium"
  singleton_pile_target: 100
  stream: true
  timeout_ms: 600000

# Embedding model for the grouping stage.
# Qwen3-Embedding-8B via OpenRouter at 4096 dims; matches vector(4096) in
# item_embeddings (migration 020). batch_size controls texts per API call.
# body_cap is set in grouping.embedding.body_cap (2000 chars) — not here.
embeddings:
  model: qwen/qwen3-embedding-8b
  provider: openrouter
  dims: 4096
  batch_size: 100
  timeout_ms: 120000

# Embedding-based grouping stage — the pipeline's clustering step.
# Four steps: embed (software + embedding model), candidate groups (software,
# cosine-similarity graph + union-find), attach (LLM, near-miss singletons),
# describe (LLM, neutral title + summary per multi-item cluster).
#
# THE KNOB: embedding.similarity_threshold is the primary tuning lever.
# Higher = fewer, tighter groups. Lower = more, looser groups.
grouping:
  # Stage-level model. The attach and describe sub-steps set their own models
  # under grouping.attach / grouping.describe; this top-level value satisfies
  # the shared stage-config schema.
  model: alibaba/qwen3.6-27b:thinking
  provider: nanogpt
  temperature: 0.1
  max_tokens: 8192
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000
  embedding:
    # Max characters from body_text included in embed text per item.
    # 2000 chars captures enough of the article opening that same-event
    # pairs score meaningfully higher than same-topic-different-event pairs.
    body_cap: 2000
    # Cosine similarity threshold for adding an edge between two items.
    # Start here and sweep: higher tightens groups, lower loosens them.
    similarity_threshold: 0.66
    # Top-K nearest neighbors per item considered for edge creation.
    # Limits graph density; raise if same-story items are getting missed.
    top_k: 10
  # Attach pass: for each singleton anchor (processed in descending best title-sim
  # order), generate candidate clusters and other singletons whose title-only
  # cosine similarity to the anchor is >= candidate_floor, offer ALL of them to a
  # cheap LLM, and confirm which cover the same news event. Two outcomes: attach
  # anchor to an existing cluster, or pair two singletons into a new 2-item cluster.
  # Sequential union-find ensures a consumed anchor/singleton is not reprocessed.
  # Runs after connected-components, before describe. Attach-only; never splits.
  # candidate_floor is the sole candidate filter — no per-anchor cap. Silently
  # dropping a candidate above the floor could miss a genuine duplicate.
  attach:
    enabled: true
    # Cosine-similarity floor (title-only) for offering a candidate to the LLM.
    # 0.55 catches same-event pairs (measured at 0.78+) and cross-event near-misses
    # (e.g. Samsung pair at 0.635) while skipping true orphans. The LLM is the
    # precision gate — there is no auto-accept tier and no per-anchor cap.
    candidate_floor: 0.55
    model: zai-org/glm-5.1:thinking
    provider: nanogpt
    temperature: 0.1
    max_tokens: 24000
    concurrency: 10
    reasoning_effort: "xhigh"
    stream: true
    timeout_ms: 300000
  # Describe pass: cheap batched LLM call that writes a neutral title and
  # short summary for every multi-item cluster. Runs after attach. Singletons
  # skip this pass.
  describe:
    model: zai-org/glm-5.1
    provider: nanogpt
    temperature: 0.1
    max_tokens: 4096
    # Clusters per LLM call. Each call sees batch_size clusters, each shown
    # as its member items (title + body excerpt).
    batch_size: 20
    concurrency: 10
    reasoning_effort: "none"
    stream: true
    timeout_ms: 120000
  # Top-N rows (clusters + singletons combined) by bio-relevance score that
  # pass into the editor pile. Replaces the old all-clusters + singleton_pile_target logic.
  pile_target: 150
