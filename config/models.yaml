# Model assignments per pipeline stage.
# All models must be accessible via LLM_BASE_URL (OpenAI-compatible).

# Bio-aware relevance floor between the preprocessor and the clusterer. Same
# model family as editor_pass_1's bio-aware scoring, since this stage is built
# to become a scorer itself with only a prompt swap (see docs/decisions.md).
prefilter:
  model: zai-org/glm-5.1
  provider: nanogpt
  temperature: 0.1
  max_tokens: 4096
  batch_size: 40
  concurrency: 10
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000

# Unbuilt placeholder — stage not yet implemented; model id is not real.
researcher:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.4
  max_tokens: 4000
  step_limit: 20

editor:
  model: moonshotai/kimi-k2.6:thinking
  provider: nanogpt
  temperature: 0.2
  max_tokens: 48000
  reasoning_effort: "medium"
  stream: true
  timeout_ms: 900000
  # stream: true — keeps the HTTP connection alive past undici's ~300s headers
  # timeout when a reasoning model thinks before emitting the first token.
  # timeout_ms: 600000 — generous body/stream timeout for long reasoning calls.
  # provider: nanogpt — uses NANOGPT_BASE_URL / NANOGPT_API_KEY.
  fallback:
    model: zai-org/glm-5.1:thinking
    provider: nanogpt
    reasoning_effort: "medium"

# Unbuilt placeholder — stage not yet implemented; model id is not real.
writers:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.6
  max_tokens: 2000

editor_pass_1:
  model: zai-org/glm-5.1:thinking
  provider: nanogpt
  temperature: 0.1
  max_tokens: 4096
  batch_size: 40
  concurrency: 10
  reasoning_effort: "none"
  singleton_pile_target: 100
  stream: true
  timeout_ms: 600000

# Embedding model for the grouping stage.
# Qwen3-Embedding-8B via OpenRouter at 4096 dims; matches vector(4096) in
# item_embeddings (migration 020). batch_size controls texts per API call.
# body_cap is set in grouping.embedding.body_cap (2000 chars) — not here.
embeddings:
  model: qwen/qwen3-embedding-8b
  provider: openrouter
  dims: 4096
  batch_size: 100
  timeout_ms: 120000

# Embedding-based grouping stage — the pipeline's clustering step.
# Four steps: embed (software + embedding model), candidate groups (software,
# cosine-similarity graph + union-find), attach (LLM, near-miss singletons),
# describe (LLM, neutral title + summary per multi-item cluster).
#
# THE KNOB: embedding.similarity_threshold is the primary tuning lever.
# Higher = fewer, tighter groups. Lower = more, looser groups.
grouping:
  # Stage-level model. The attach and describe sub-steps set their own models
  # under grouping.attach / grouping.describe; this top-level value satisfies
  # the shared stage-config schema.
  model: alibaba/qwen3.6-27b:thinking
  provider: nanogpt
  temperature: 0.1
  max_tokens: 8192
  reasoning_effort: "none"
  stream: true
  timeout_ms: 600000
  embedding:
    # Max characters from body_text included in embed text per item.
    # 2000 chars captures enough of the article opening that same-event
    # pairs score meaningfully higher than same-topic-different-event pairs.
    body_cap: 2000
    # Cosine similarity threshold for adding an edge between two items.
    # Start here and sweep: higher tightens groups, lower loosens them.
    similarity_threshold: 0.66
    # Top-K nearest neighbors per item considered for edge creation.
    # Limits graph density; raise if same-story items are getting missed.
    top_k: 10
  # Attach pass: for each multi-item cluster, find singletons whose max cosine
  # similarity to any cluster member falls in [attach_floor, similarity_threshold)
  # — the near-miss band — and make one LLM call per cluster to confirm which
  # (if any) belong to the same specific event. Runs after connected-components,
  # before describe. Attach-only; never splits clusters.
  attach:
    enabled: true
    # Lower bound of the near-miss band. Singletons below this floor are too
    # dissimilar to be worth offering to the LLM.
    attach_floor: 0.50
    model: zai-org/glm-5.1
    provider: nanogpt
    temperature: 0.1
    max_tokens: 1024
    concurrency: 10
    reasoning_effort: "none"
    stream: true
    timeout_ms: 120000
  # Describe pass: cheap batched LLM call that writes a neutral title and
  # short summary for every multi-item cluster. Runs after attach. Singletons
  # skip this pass.
  describe:
    model: zai-org/glm-5.1
    provider: nanogpt
    temperature: 0.1
    max_tokens: 4096
    # Clusters per LLM call. Each call sees batch_size clusters, each shown
    # as its member items (title + body excerpt).
    batch_size: 20
    concurrency: 10
    reasoning_effort: "none"
    stream: true
    timeout_ms: 120000
  # Top-N rows (clusters + singletons combined) by bio-relevance score that
  # pass into the editor pile. Replaces the old all-clusters + singleton_pile_target logic.
  pile_target: 150
