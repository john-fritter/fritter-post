# Model assignments per pipeline stage.
# All models must be accessible via LLM_BASE_URL (OpenAI-compatible).

filter:
  model: deepseek-v4-flash
  temperature: 0.1
  max_tokens: 4096
  batch_size: 100
  concurrency: 3
  reasoning_effort: "none"

triage:
  model: qwen3.5:397b
  temperature: 0.1
  max_tokens: 65536
  reasoning_effort: "none"
  clustering:
    # Ordered rounds for the incremental clusterer. Each round admits items
    # whose source_type matches one of `types`, or any not-yet-admitted item
    # if `types` includes the catch-all "*". Round membership is evaluated
    # in order, so a later "*" round only sees what earlier rounds didn't take.
    rounds:
      - name: wire
        types: [wire]
      - name: rest
        types: ["*"]

researcher:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.4
  max_tokens: 4000
  step_limit: 20

editor:
  model: glm-5.1
  temperature: 0.2
  max_tokens: 16000
  reasoning_effort: "low"

writers:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.6
  max_tokens: 2000

editor_pass_1:
  model: glm-5.1
  temperature: 0.1
  max_tokens: 4096
  batch_size: 40
  concurrency: 3
  reasoning_effort: "none"
  singleton_pile_target: 100
