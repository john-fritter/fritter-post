# Model assignments per pipeline stage.
# All models must be accessible via LLM_BASE_URL (OpenAI-compatible).

filter:
  model: deepseek-v4-flash
  temperature: 0.1
  max_tokens: 4096
  batch_size: 100
  concurrency: 3
  reasoning_effort: "none"

triage:
  model: qwen3.5:397b
  temperature: 0.1
  max_tokens: 65536
  reasoning_effort: "none"
  clustering:
    # Ordered rounds for the incremental clusterer. Each round admits items
    # whose preprocessed_items.group matches one of `groups`, or any
    # not-yet-admitted item if `groups` includes the catch-all "*". Round
    # membership is evaluated in order, so a later "*" round only sees what
    # earlier rounds didn't take.
    #
    # Order is spine-first by design: wire and national-prominence groups go
    # first so the major stories of the day already exist as clusters before
    # the regional/topical tail (local, labor, climate, tech, ai, science...)
    # accretes onto them or forms its own smaller clusters. This keeps every
    # round's "new items" pile in the model's working range — see
    # docs/decisions.md 2026-06-07 "two-round split → group-based rounds".
    #
    # group is set on preprocessed_items at preprocess time from each
    # source's `group` in config/sources.yaml — a structural clustering axis,
    # not an editorial tag (see that file's schema comment).
    rounds:
      - name: wire
        groups: [wire]
      - name: national
        groups: [national]
      - name: intl_broad
        groups: [intl_broad]
      - name: accountability
        groups: [accountability]
      - name: legal
        groups: [legal]
      - name: intl_regional
        groups: [intl_regional]
      - name: local
        groups: [local]
      - name: labor
        groups: [labor]
      - name: climate
        groups: [climate]
      - name: tech
        groups: [tech]
      - name: ai
        groups: [ai]
      - name: science
        groups: [science]
      - name: rest
        groups: ["*"]

researcher:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.4
  max_tokens: 4000
  step_limit: 20

editor:
  model: glm-5.1
  temperature: 0.2
  max_tokens: 16000
  reasoning_effort: "low"

writers:
  model: gemini-3-flash-preview  # placeholder
  temperature: 0.6
  max_tokens: 2000

editor_pass_1:
  model: glm-5.1
  temperature: 0.1
  max_tokens: 4096
  batch_size: 40
  concurrency: 3
  reasoning_effort: "none"
  singleton_pile_target: 100
