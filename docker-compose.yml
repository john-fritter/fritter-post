services:
  postgres:
    # Pinned by digest, deliberately. Text indexes are ordered by the C library's
    # collation rules, so a base-image change under a floating tag silently
    # corrupts them: the June 11 switch from postgres:16-alpine (musl) to this
    # image (Debian 12, glibc 2.36) did exactly that to raw_items' unique index
    # (open item 0b). The cluster was initialised under musl, so datcollversion
    # is NULL and Postgres cannot warn about a change. Upgrading this image is a
    # deliberate act: pull, then REINDEX every collation-dependent index, then
    # run amcheck (the nightly backup does). Digest = pg16, Debian 12, glibc 2.36.
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # No published ports — reachable only from within the stack.

  app:
    build: .
    container_name: fritter-post-app-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal       # reaches postgres by service name
    # Runtime note: after compose creates the app container, connect it to
    # seedbox_default manually so Caddy can reach fritter-post-app-1:3000.

volumes:
  postgres_data:

networks:
  internal:
  seedbox_default:
    external: true
